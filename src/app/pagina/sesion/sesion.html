<div class="main-split-container">
  
  <!-- COLUMNA IZQUIERDA: Texto e Imagen -->
  <div class="info-column">
    <div class="info-content">
      <h2>Acceso al Sistema</h2>
      <p>Ingresa con el correo electrónico y contraseña que registraste previamente para acceder al Sistema de Intermediación Laboral.</p>
      <img src="img\plataforma.png" alt="ITB Conecta" class="img-fluida">
    </div>
  </div>

  <!-- COLUMNA DERECHA: Formulario y Enlace -->
  <div class="form-column">
    <div class="login-box">
      <form [formGroup]="loginForm" (ngSubmit)="ingresar()">
        <input 
          type="email" 
          formControlName="email" 
          placeholder="Tu correo">
        
        <input 
          type="password" 
          formControlName="password" 
          placeholder="Tu contraseña">

        <button type="submit" [disabled]="loginForm.invalid">Iniciar Sesión</button>
      </form>
      

      <div class="contenedor-enlace">
        <p>Si aún no tienes una cuenta, puedes registrarte haciendo clic en el siguiente enlace.</p> 
        <a routerLink="/registrar" class="mi-enlace">Ir a Registrarse</a>
      </div>
    </div>
  </div>

</div>
