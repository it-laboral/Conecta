<div class="contenedor-recupero">
  <div class="tarjeta-recupero">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p class="subtitulo">Ingresá tu correo electrónico registrado y te enviaremos un enlace para restablecerla.</p>

    <!-- Alertas de estado -->
    @if (mensajeExito) {
      <div class="alerta exito">
        {{ mensajeExito }}
      </div>
    }

    @if (mensajeError) {
      <div class="alerta error">
        {{ mensajeError }}
      </div>
    }

    <!-- Formulario -->
    <form (ngSubmit)="enviarSolicitud()">
      <div class="campo">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="ejemplo@dominio.com"
          required
          [disabled]="cargando"
        />
      </div>

      <button type="submit" class="btn-principal" [disabled]="cargando">
        @if (cargando) {
          <span>Enviando enlace...</span>
        } @else {
          <span>Enviar Enlace de Recuperación</span>
        }
      </button>
    </form>

    <div class="acciones">
      <a routerLink="/sesion" class="link-volver">← Volver a Iniciar Sesión</a>
    </div>
  </div>
</div>
